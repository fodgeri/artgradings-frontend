name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-build-typecheck:
    # SECURITY — do not remove. This repo is public and the runner is
    # self-hosted, persistent, and its user is in the docker group (root on the
    # host). A fork PR runs its OWN package.json, and `npm ci` executes
    # lifecycle scripts — arbitrary code execution on our box, no workflow edit
    # required. Fork PRs must never reach this runner. If external
    # contributions are wanted later, give them a separate GitHub-hosted job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Self-hosted (geri-mint) — does not consume GitHub Actions minutes.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No `cache: npm` on self-hosted: ~/.npm persists on the box between
          # runs (the runner wipes only _work), so npm ci already hits a warm
          # local cache. The remote GHA cache would re-upload the tree each run.

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs before the build on purpose: the unit suite needs no .next/ and
      # finishes in seconds, so a failure here saves the ~2-minute build.
      - name: Test
        run: npm test

      # Build MUST run before the type check. Next 16 generates types into
      # .next/types/ during the build (LayoutProps, PageProps, route types).
      # On a clean checkout there is no .next/, so `tsc --noEmit` first fails
      # with "Cannot find name 'LayoutProps'" in app/[locale]/layout.tsx.
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Placeholders, not real credentials. CI must never need production
          # secrets to prove the code compiles — that way a hostile PR has
          # nothing to exfiltrate from this job.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_SENTRY_DSN: ""

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  db-tests:
    # SECURITY — do not remove. Identical to the guard on lint-build-typecheck
    # and required for the same reason: this repo is public and the runner is
    # self-hosted, persistent, and its user is in the docker group (root on the
    # host). A fork PR runs its OWN package.json, and `npm ci` executes
    # lifecycle scripts. Omitting this line reopens that hole through a new
    # door.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Installs the Supabase CLI as a devDependency. Deliberately not
      # `supabase/setup-cli@v1`: the CLI is already vendored, and a
      # third-party action on a root-capable runner buys nothing.
      - name: Install dependencies
        run: npm ci

      # Only the database, not the ten-service `supabase start`. pgTAP needs
      # Postgres; it does not need GoTrue, Storage or Studio.
      - name: Start the local database
        run: npx supabase db start

      # Replays every migration into an empty database, then the seed. A
      # migration that only works against the dev project's current state
      # fails here.
      - name: Apply migrations from empty
        run: npx supabase db reset

      - name: Run database tests
        run: npx supabase test db

      # The runner is persistent: without this, containers and bound ports
      # survive the job and the next run collides with them.
      - name: Stop the local database
        if: always()
        run: npx supabase stop --no-backup
